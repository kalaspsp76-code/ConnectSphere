{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - ConnectSphere</title>

    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>

<body>

    <div class="edit-profile-container">

        <h1>Edit Profile</h1>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Profile Picture -->
            <div class="profile-picture-section">

                {% if profile.profile_picture %}
                <img src="{{ profile.profile_picture.url }}" alt="Profile Picture" class="profile-picture"> {% else %}
                <div class="profile-placeholder">
                    {{ request.user.username|first|upper }}
                </div>
                {% endif %}

                <label for="profile_picture">
                    Change Profile Picture
                </label>

                <input type="file" name="profile_picture" id="profile_picture" accept="image/*">

            </div>

            <!-- Username -->
            <div class="form-group">
                <label for="username">Username</label>

                <input type="text" name="username" id="username" value="{{ request.user.username }}" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>

                <input type="email" name="email" id="email" value="{{ request.user.email }}">
            </div>

            <!-- Bio -->
            <div class="form-group">
                <label for="bio">Bio</label>

                <textarea name="bio" id="bio" rows="5" placeholder="Tell people about yourself...">{{ profile.bio }}</textarea>
            </div>

            <!-- Buttons -->
            <div class="form-actions">

                <button type="submit">
                    Save Changes
                </button>

                <a href="{% url 'profile' %}">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</body>

</html>
