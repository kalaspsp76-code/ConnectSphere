<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ConnectSphere</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
        }
        
        .login-container {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.10);
        }
        
        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 30px;
        }
        
        .messages {
            margin-bottom: 18px;
        }
        
        .messages p {
            padding: 10px;
            border-radius: 8px;
            background: #fee2e2;
            color: #b91c1c;
            font-size: 14px;
        }
        
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }
        
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d0d5dd;
            border-radius: 9px;
            margin-bottom: 18px;
            font-size: 15px;
            outline: none;
        }
        
        input:focus {
            border-color: #2563eb;
        }
        
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        button:hover {
            background: #1d4ed8;
        }
        
        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #667085;
        }
        
        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">
            ConnectSphere
        </div>

        <p class="subtitle">
            Welcome back! Login to your account.
        </p>

        {% if messages %}

        <div class="messages">

            {% for message in messages %}

            <p>{{ message }}</p>

            {% endfor %}

        </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label>Username</label>

            <input type="text" name="username" placeholder="Enter your username" required>

            <label>Password</label>

            <input type="password" name="password" placeholder="Enter your password" required>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register-link">

            Don't have an account?

            <a href="/register/">
                Create account
            </a>

        </div>

    </div>

</body>

</html>
